"$schema" = 'https://starship.rs/config-schema.json'

format = """
[┌─](fg:#C51A4A)\
[](fg:#6CC04A)\
$hostname\
[ ](bg:#6CC04A fg:#F7C0CF)\
[](bg:#F7C0CF fg:#C51A4A)\
[](bg:#C51A4A fg:#F7C0CF)\
$directory\
[](fg:#C51A4A bg:#680D27)\
$git_branch\
$git_status\
[  󰣀  ](fg:#FCE8EE bg:#680D27)\
[](fg:#680D27 bg:#3F0818)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#3F0818 bg:#170308)\
$time\
[ ](fg:#170308)\
\n[└───>](fg:#C51A4A)$character"""

[hostname]
style = "bg:#6CC04A"
format = '[[ $hostname](fg:#FCE8EE bg:#6CC04A)]($style)'

[character]
success_symbol = '[](bold green)'

[directory]
style = "fg:#FCE8EE bg:#C51A4A"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#170308"
format = '[[  $time ](fg:#BCD6FA bg:#170308)]($style)'
