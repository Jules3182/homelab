"$schema" = 'https://starship.rs/config-schema.json'

format = """
[┌─](fg:#0B57A4)\
[](fg:#0B57A4)\
$hostname\
[ ](bg:#0B57A4 fg:#FFFFFF)\
[](bg:#FFFFFF fg:#072C61)\
[](bg:#0B57A4 fg:#FFFFFF)\
$directory\
[](fg:#0B57A4 bg:#072C61)\
$git_branch\
$git_status\
[  󰣀  ](fg:#FFFFFF bg:#072C61)\
[](fg:#072C61 bg:#051F43)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#051F43 bg:#020B18)\
$time\
[ ](fg:#020B18)\
\n[└───>](fg:#0B57A4)$character"""

[hostname]
style = "bg:#0B57A4"
format = '[[ $hostname](fg:#BCD6FA bg:#0B57A4)]($style)'

[character]
success_symbol = '[](bold green)'

[directory]
style = "fg:#FFFFFF bg:#0B57A4"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#020B18"
format = '[[  $time ](fg:#BCD6FA bg:#020B18)]($style)'
