"$schema" = 'https://starship.rs/config-schema.json'

format = """
[┌─](fg:#E95420)\
[](fg:#E95420)\
$hostname\
[ ](bg:#E95420 fg:#090c0c)\
[](bg:#090c0c fg:#E95420)\
[](bg:#E95420 fg:#090c0c)\
$directory\
[](fg:#E95420 bg:#56334B)\
$git_branch\
$git_status\
[  󰣀  ](fg:#FAD4C7 bg:#56334B)\
[](fg:#56334B bg:#411934)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#411934 bg:#2C001E)\
$time\
[ ](fg:#2C001E)\
\n[└───>](fg:#E95420)$character"""

[hostname]
style = "bg:#E95420"
format = '[[ $hostname](fg:#95320F bg:#E95420)]($style)'

[character]
success_symbol = '[](bold green)'

[directory]
style = "fg:#131313 bg:#E95420"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#2C001E"
format = '[[  $time ](fg:#AA99A5 bg:#2C001E)]($style)'
